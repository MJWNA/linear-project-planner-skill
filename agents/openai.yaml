interface:
  display_name: Linear Project Planner
  short_description: Creates agent-ready Linear remediation projects with milestones, labels, dependencies, docs links, ledgers, and verification gates.
  default_prompt: Create or restructure a Linear project for this codebase using the standard agent-ready remediation format.
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "context7"
      description: "Current framework, deployment, ORM, auth, validation, and SDK documentation lookup"
    - type: "command"
      value: "linear-agent"
      description: "Local Linear execution-state wrapper for companion ledger updates and read-back action plans"
