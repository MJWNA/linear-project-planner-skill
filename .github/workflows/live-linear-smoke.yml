name: Live Linear Smoke

permissions:
  contents: read

on:
  schedule:
    - cron: "43 2 * * 2"
  workflow_dispatch:
    inputs:
      project:
        description: Disposable Linear project name
        required: false
        default: "Linear Agent Disposable Smoke"
      apply:
        description: Type apply-linear to allow the smoke apply gate
        required: false
        default: "dry-run"

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.apply == 'apply-linear'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Dry-run smoke
        run: scripts/linear-agent graph-plan --from tests/fixtures/linear_graph_plan.json

      - name: Apply disposable graph
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_AGENT_SMOKE_PROJECT: ${{ github.event.inputs.project || 'Linear Agent Disposable Smoke' }}
        run: |
          set -euo pipefail
          test -n "${LINEAR_API_KEY:-}"
          scripts/linear-agent smoke --project "$LINEAR_AGENT_SMOKE_PROJECT" --apply-linear --json
