name: Live Linear Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      project:
        description: Disposable Linear project ID or key
        required: true
      apply:
        description: Type apply-linear to allow the smoke apply gate
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.event.inputs.apply == 'apply-linear'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dry-run smoke
        run: scripts/linear-agent smoke --project "${{ inputs.project }}"

      - name: Apply-gated smoke
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${LINEAR_API_KEY:-}"
          scripts/linear-agent smoke --project "${{ inputs.project }}" --apply-linear
