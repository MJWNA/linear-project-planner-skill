name: Feature request
description: Suggest an improvement to the planning workflow, ledger, or wrapper
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would good look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternatives or tradeoffs considered?
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should this be tested?
